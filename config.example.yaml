adaptive_concurrency: true
allowed_user_ids: []
always_fresh_download: false
batch_interval: 500
batch_size: 20
bot_token: ''
chat: []
date_format: '%Y_%m'
enable_private_chat: true
file_formats: {}
file_name_prefix:
  - message_id
  - file_name
file_name_prefix_split: ' - '
file_path_prefix:
  - chat_title
group_same_channel_files: true
max_connected_channels: 10
max_download_task: 3
media_types:
  - audio
  - document
  - photo
  - video
  - voice
  - animation
proxy: null
save_path: ./downloads
web_host: 127.0.0.1
web_port: 8000
web_cors_origins:
  - http://127.0.0.1:8000
environment: local
aliyundrive_upload:
  enabled: false
  remote_path: /video
  delete_after_upload: false
user_api:
  api_hash: ''
  api_id: ''
  proxy: null

# 默认操作：收到媒体时自动执行（跳过交互询问）
default_action:
  enabled: false
  action: download   # download / forward / cloud / all
  target_chat: ''    # 转发目标 (forward/all 时使用)
  delete_after_forward: false

# 下载后自动转发到指定聊天
local_forward:
  enabled: false
  target_chat: ''
  delete_after_forward: false

# 下载后智能重命名
file_rename:
  enabled: false
  # 变量: {channel_title} {channel_username} {date} {time} {original_name} {ext}
  pattern: '{channel_title}/{date}_{original_name}'

# 文件去重
file_dedup:
  enabled: true
  by_message_id: true
  by_file_id: false

# 下载进度推送通知
progress_notification: true

# 大文件处理 — 当文件超过 2GB 时可用 ffmpeg 压缩
large_file:
  enabled: true          # 是否启用大文件处理
  threshold_mb: 2000     # 阈值 (MB), 超过此大小触发处理
  action: ask            # "compress" 自动压缩 | "skip" 跳过下载 | "ask" 询问用户
  crf: 23                # ffmpeg CRF 值 (0-51), 越低画质越好体积越大
  max_bitrate: ''        # 可选最大码率限制 (如 "4000k"), 留空使用 CRF 模式
